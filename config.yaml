# Параметры симуляций. Код сценариев читает значения только отсюда.

seed: 20261004
alpha: 0.05
n_jobs: 4               # число процессов, ещё ограничивается свободной памятью
chunk_size: 1000        # максимум повторений в одной задаче
max_chunk_cells: 1000000  # максимум чисел reps x n в одном массиве (около 8 МБ)
results_dir: results
figures_dir: figures

# Параметры генераторов метрик по умолчанию
metrics:
  conversion:
    p: 0.10
  revenue:
    p: 0.10
    mu: 6.0
    sigma: 1.2
  ctr:
    views_mean: 10.0
    views_shape: 2.0     # форма Гамма-распределения интенсивности просмотров
    beta_a: 2.0
    beta_b: 38.0
  pre_period:
    mean: 100.0
    sd: 20.0
    rho: 0.7

scenarios:
  aa:
    n_reps: 10000
    n_reps_bootstrap: 2000
    n_boot: 1000
    n_grid: [50, 100, 500, 1000, 10000]

  power:
    n_reps: 10000
    p: 0.10
    uplifts: [0.02, 0.05, 0.10, 0.20]
    n_grid: [500, 1000, 2000, 5000, 10000, 20000, 50000]
    target_power: 0.80

  peeking:
    n_reps: 10000
    n_total: 20000
    looks: [1, 2, 5, 10, 20, 50]
    uplift_power: 0.08     # эффект для оценки потери мощности
    trajectories: 20
    trajectory_looks: 100

  heavy_tails:
    n_reps: 10000
    n_reps_bootstrap: 2000
    n_boot: 1000
    n: 5000
    uplift: 0.15
    sigmas: [0.5, 1.0, 1.5, 2.0]
    trim_quantile: 0.99
    shape_trap:
      sigma_a: 1.2
      sigma_b: 1.8

  ratio:
    n_reps: 10000
    n_reps_bootstrap: 2000
    n_boot: 1000
    n: 2000
    uplifts: [0.0, 0.10]
    # Концентрация Бета-распределения a + b при среднем CTR 5%:
    # чем меньше, тем разнороднее пользователи
    heterogeneity:
      low: 400
      medium: 40
      high: 4

  cuped:
    n_reps: 10000
    n: 1000
    uplift: 0.02
    rhos: [0.0, 0.3, 0.5, 0.7, 0.9]

  multiple:
    n_reps: 10000
    n: 1000
    ks: [1, 5, 10, 20]
    rhos: [0.0, 0.5]
    with_effect:
      k: 10
      n_true: 2
      effect_sd: 0.125     # эффект в стандартных отклонениях метрики

  srm:
    n_reps: 10000
    n_totals: [10000, 100000, 1000000]
    shares_b: [0.50, 0.505, 0.51, 0.52]
    alpha_srm: 0.001
    dropout:
      n_total: 20000
      drop_rates: [0.0, 0.01, 0.02, 0.04, 0.08]   # доля пользователей B, которые пропадают
      low_activity_quantile: 0.3            # выпадают только из 30% наименее активных

benchmark:
  # два случая: маленький n (дорогие накладные расходы на эксперимент)
  # и большой n (основное время уходит на генерацию случайных чисел)
  cases:
    - {n: 1000, n_reps: 100000}
    - {n: 10000, n_reps: 10000}
