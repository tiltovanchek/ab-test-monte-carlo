[project]
name = "abtest-sim"
version = "0.1.0"
description = "Монте-Карло проверка статистических методов A/B-тестирования"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "statsmodels>=0.14.4",
    "matplotlib>=3.9",
    "duckdb>=1.1",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abtest_sim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
